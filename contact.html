<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact — Brendan</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@700&family=Source+Code+Pro:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/png" href="images/bworld_logo.png">
</head>
<body class="projects-page">
  <header class="header">
    <a href="index.html" class="logo"><img src="images/bworld_logo.png" alt="Bworld"></a>
    <button class="menu-toggle" aria-label="Toggle navigation">MENU ▾</button>
    <nav class="nav-item nav-photos"><a href="index.html">PHOTOS</a></nav>
    <nav class="nav-item"><a href="pricing.html">PRICING</a></nav>
    <nav class="nav-item"><a href="contact.html">CONTACT</a></nav>
    <nav class="nav-item nav-about"><a href="about-me.html">ABOUT ME</a></nav>
  </header>

  <div class="mobile-nav-panel">
    <a href="index.html">Photos</a>
    <a href="pricing.html">Pricing</a>
    <a href="contact.html">Contact</a>
    <a href="about-me.html">About me</a>
  </div>

  <main class="projects-main contact-main">
    <h1 class="projects-title"><br>Contact</h1>
    <div class="site-subtitle">brendan's pictures</div>
    <p class="projects-intro contact-intro">
      Reach out to me about taking photos below: <br> <br>
      (make sure your email is typed correctly or I won't see your message)
    </p>

    <section class="contact-card">
      <form
        action="https://formspree.io/f/mwvrozgd"
        method="POST"
        class="contact-form"
      >
        <div class="contact-row">
          <label class="contact-label">
            <span>Your name</span>
            <input type="text" name="name" required>
          </label>
          <label class="contact-label">
            <span>Your email</span>
            <input type="email" name="email" required>
          </label>
        </div>

        

        <label class="contact-label">
          <span>Your message</span>
          <textarea name="message" rows="5" required></textarea>
        </label>

        <button type="submit" class="contact-submit">Send</button>
      </form>
    </section>
  </main>

  <script src="nav.js"></script>
</body>
</html>
