<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brendan's Pictures</title>

<!-- Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@700&family=Source+Code+Pro:wght@300;400;500&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">
<link rel="icon" type="image/png" href="images/bworld_logo.png">
</head>

<body>

<header class="header">
  <div class="logo-block">
    <a href="#" class="logo"><img src="images/bworld_logo.png" alt="Bworld"></a>
    <div class="site-subtitle">brendan's pictures</div>
  </div>
  <button class="menu-toggle" aria-label="Toggle navigation">MENU ▾</button>
  <nav class="nav-item nav-photos"><a href="index.html">PHOTOS</a></nav>
  <nav class="nav-item"><a href="pricing.html">PRICING</a></nav>
  <nav class="nav-item"><a href="contact.html">CONTACT</a></nav>
  <nav class="nav-item nav-about"><a href="about-me.html">ABOUT ME</a></nav>
</header>

<div class="mobile-nav-panel">
  <a href="index.html">Photos</a>
  <a href="pricing.html">Pricing</a>
  <a href="contact.html">Contact</a>
  <a href="about-me.html">About me</a>
</div>

<!-- LOADING TITLE (kept for JS timing but visually hidden) -->
<h1 id="loadingTitle">Brendan's Portfolio</h1>

<!-- CENTER TITLE (category on hover) -->
<h1 id="mainTitle">Brendan's Photos</h1>

<!-- FIXED BOTTOM-LEFT BRAND (fades in as loading title fades out) -->
<div id="brandText">BRENDAN'S PORTFOLIO</div>

<!-- CATEGORY LABEL (fades in on left when a category is selected) -->
<div id="categoryLabel"></div>

<!-- DESKTOP: collage thumbnails. MOBILE: carousel (see .mobile-carousel-wrap) -->
<section class="collage" id="collage">
<img src="images/jpegs (smaller size)/image compress/places_cali_mountains_TN.jpg" class="thumb" data-category="PLACES" decoding="async">
<img src="images/jpegs (smaller size)/image compress/studio_pyc_wk2 (hands)_TN.jpg" class="thumb" data-category="STUDIO" decoding="async">
<img src="images/jpegs (smaller size)/image compress/people_caymanfriends_TN.jpg" class="thumb" data-category="PEOPLE" decoding="async">
<img src="images/jpegs (smaller size)/image compress/grad_mia_TN.jpg" class="thumb" data-category="GRAD" decoding="async">
<p class="collage-mobile-hint">Tap a picture to see PLACES, STUDIO, PEOPLE, or GRAD photos.</p>
</section>

<!-- MOBILE ONLY: horizontal card carousel. Tap card to open category. -->
<section class="mobile-carousel-wrap" id="mobileCarousel" aria-hidden="true">
  <div class="carousel-track" id="carouselTrack">
    <!-- Populated by script.js on mobile with repeated loops -->
  </div>
  <div class="carousel-caption">
    <span class="carousel-swipe-hint carousel-swipe-hint-left" aria-hidden="true">‹</span>
    <div class="carousel-caption-inner">
      <h2 class="carousel-title" id="carouselTitle">GRAD</h2>
      <p class="carousel-desc" id="carouselDesc">Graduation photos of my friend Mia.</p>
    </div>
    <span class="carousel-swipe-hint carousel-swipe-hint-right" aria-hidden="true">›</span>
  </div>
</section>

<button id="backToTopBtn">BACK TO TOP / CATEGORIES</button>

<!-- GALLERY -->
<section id="gallery"></section>

<!-- DESCRIPTION BOX -->
<div id="descriptionBox"></div>

<!-- IMAGE VIEWER -->
<div id="lightbox">
  <span id="closeLightbox">✕</span>
  <span id="prevLightbox" class="lightbox-arrow lightbox-arrow-left">&#10094;</span>
  <img id="lightboxImg">
  <span id="nextLightbox" class="lightbox-arrow lightbox-arrow-right">&#10095;</span>
</div>

<script src="script.js"></script>
<script src="nav.js"></script>
</body>
</html>
